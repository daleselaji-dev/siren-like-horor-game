<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>返潮 FANCHAO — 蚀湾 · 千禧婚宴酒店恐怖 Demo</title>
  <style>
    :root {
      --paper: #d8cfb8;
      --ink: #2a2620;
      --blood: #7a1f18;
      --fog: #9aa4a8;
      --lantern: #ff8438;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04060a; }
    body { font-family: "Songti SC", "Noto Serif SC", "SimSun", serif; color: #cfd6d6; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- 通用覆盖层 ---------- */
    .overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .hidden { display: none !important; }

    /* ---------- 电影黑边（演出用） ---------- */
    #letterbox { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
    #letterbox .lb { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height 1.6s cubic-bezier(.4,0,.2,1); }
    #letterbox .lb-top { top: 0; }
    #letterbox .lb-bottom { bottom: 0; }
    #letterbox.on .lb { height: 11vh; }

    /* ---------- 标题画面 ---------- */
    #title-screen {
      position: fixed; inset: 0; z-index: 100; pointer-events: auto;
      background: #020406; overflow: hidden;
      transition: opacity 2.6s ease;
    }
    #title-screen.fading { opacity: 0; }
    #title-sea { position: absolute; inset: 0; width: 100%; height: 100%; }
    #title-vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, transparent 30%, rgba(0,0,0,.72) 100%);
    }
    #title-freq {
      position: absolute; top: 4.5%; left: 4%; z-index: 3;
      font-family: "Courier New", monospace; font-size: 12px; letter-spacing: .28em;
      color: rgba(150,170,168,.55); white-space: pre;
      animation: freqFlicker 3.7s infinite steps(2);
    }
    @keyframes freqFlicker {
      0%, 92% { opacity: 1; } 93%, 95% { opacity: .25; } 96%, 100% { opacity: .8; }
    }
    #title-center {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #title-name {
      display: flex; align-items: baseline; gap: .55em;
      font-size: clamp(72px, 12vw, 132px); font-weight: 700; color: #c5cfcf;
      text-shadow: 0 0 34px rgba(110,160,170,.28), 0 3px 0 #000, 0 0 90px rgba(60,110,120,.18);
      position: relative;
    }
    #title-name span { opacity: 0; filter: blur(14px); transform: translateY(12px); }
    #title-screen.ready #title-name span { animation: charReveal 2.6s cubic-bezier(.2,.6,.2,1) forwards; }
    #title-screen.ready #title-name span:nth-child(2) { animation-delay: .75s; }
    @keyframes charReveal {
      0% { opacity: 0; filter: blur(14px); transform: translateY(12px); }
      60% { opacity: 1; filter: blur(0.6px); }
      100% { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    /* 朱印：永涨潮 */
    #title-seal {
      position: absolute; right: -1.4em; top: -0.25em;
      width: 1.05em; padding: .18em 0; font-size: clamp(16px, 2vw, 22px);
      writing-mode: vertical-rl; text-orientation: upright; letter-spacing: .18em;
      color: #c8402c; border: 2px solid rgba(170,45,28,.85); border-radius: 2px;
      text-align: center; line-height: 1.05; background: rgba(90,18,10,.12);
      box-shadow: 0 0 18px rgba(160,40,25,.25), inset 0 0 8px rgba(160,40,25,.2);
      opacity: 0; transform: scale(1.7) rotate(8deg);
    }
    #title-screen.ready #title-seal { animation: sealStamp .5s ease 2.2s forwards; }
    @keyframes sealStamp {
      0% { opacity: 0; transform: scale(1.7) rotate(8deg); }
      70% { opacity: 1; transform: scale(.96) rotate(-2deg); }
      100% { opacity: .92; transform: scale(1) rotate(-2deg); }
    }
    #title-sub {
      margin-top: 26px; font-size: 15px; letter-spacing: .62em; text-indent: .62em; color: #647278;
      opacity: 0;
    }
    #title-en {
      margin-top: 8px; font-size: 12px; letter-spacing: .95em; text-indent: .95em; color: #3d4a50;
      font-family: "Courier New", monospace; opacity: 0;
    }
    #title-screen.ready #title-sub { animation: softIn 1.8s ease 2.8s forwards; }
    #title-screen.ready #title-en { animation: softIn 1.8s ease 3.2s forwards; }
    @keyframes softIn { to { opacity: 1; } }
    #title-start {
      margin-top: 64px; padding: 15px 58px; font-size: 17px; letter-spacing: .48em; text-indent: .48em;
      background: rgba(6,10,12,.35); color: #9fb0b3; border: 1px solid #3d4e54; cursor: pointer;
      font-family: inherit; position: relative; overflow: hidden;
      transition: color .4s, border-color .4s, box-shadow .4s;
      opacity: 0;
    }
    #title-screen.ready #title-start { animation: softIn 1.6s ease 3.8s forwards; }
    #title-start::before {
      content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
      background: linear-gradient(to top, rgba(122,25,16,.45), rgba(122,25,16,0));
      transition: height .5s ease; pointer-events: none;
    }
    #title-start:hover { color: #e8d9b0; border-color: #8a6f3c; box-shadow: 0 0 26px rgba(200,90,40,.18); }
    #title-start:hover::before { height: 100%; }
    #title-warn {
      margin-top: 40px; font-size: 12px; color: #45535a; letter-spacing: .2em;
      max-width: 620px; text-align: center; line-height: 2.1; opacity: 0;
    }
    #title-screen.ready #title-warn { animation: softIn 2s ease 4.4s forwards; }
    #title-loading { margin-top: 26px; font-size: 13px; color: #5c6b73; letter-spacing: .3em; }

    /* ---------- HUD ---------- */
    #subtitles {
      position: fixed; left: 50%; bottom: 12.5%; transform: translateX(-50%);
      max-width: 72%; text-align: center; z-index: 20; pointer-events: none;
    }
    .subtitle-line {
      display: inline-block; padding: 8px 24px; margin-top: 6px;
      background: linear-gradient(90deg, rgba(2,4,6,0) 0%, rgba(2,4,6,.62) 12%, rgba(2,4,6,.62) 88%, rgba(2,4,6,0) 100%);
      color: #d9dfdf; font-size: 19px; letter-spacing: .12em;
      line-height: 1.8; text-shadow: 0 1px 2px #000;
      animation: subIn .4s ease;
    }
    @keyframes subIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
    .subtitle-line.speaker-radio { color: #b9a67c; font-family: "Courier New", monospace; letter-spacing: .05em; }
    .subtitle-line.speaker-song { color: #c98a8a; font-style: italic; text-shadow: 0 0 14px rgba(160,60,60,.4), 0 1px 2px #000; }

    #objective-toast {
      position: fixed; top: 8%; left: 50%; transform: translateX(-50%);
      z-index: 20; pointer-events: none; text-align: center;
      opacity: 0; transition: opacity 1s;
    }
    #objective-toast.show { opacity: 1; }
    #objective-toast .obj-label { font-size: 12px; letter-spacing: .8em; text-indent: .8em; color: #7d8f94; }
    #objective-toast .obj-rule { width: 120px; height: 1px; margin: 8px auto 0; background: linear-gradient(90deg, transparent, rgba(180,160,110,.5), transparent); }
    #objective-toast .obj-text { margin-top: 8px; font-size: 21px; letter-spacing: .25em; color: #d6ccae; text-shadow: 0 0 14px rgba(180,150,80,.25), 0 1px 2px #000; }

    #interact-prompt {
      position: fixed; left: 50%; top: 58%; transform: translateX(-50%);
      z-index: 20; pointer-events: none; font-size: 15px; letter-spacing: .2em; color: #e4dcc4;
      background: rgba(2,4,6,.5); padding: 7px 20px; border: 1px solid rgba(200,180,120,.28); border-radius: 2px;
      opacity: 0; transition: opacity .15s;
    }
    #interact-prompt.show { opacity: 1; }
    #interact-prompt kbd { font-family: monospace; color: #ffcf87; border: 1px solid #6b5a34; padding: 0 6px; border-radius: 3px; margin-right: 8px; }

    #crosshair {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 4px; height: 4px; border-radius: 50%; background: rgba(220,220,210,.5); z-index: 15; pointer-events: none;
      transition: background .3s;
    }
    /* 噪音波纹：发出噪音时从准星扩散 */
    #noise-ring {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
      z-index: 14; pointer-events: none; width: 8px; height: 8px; opacity: 0;
    }
    #noise-ring .nr {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(200,210,205,.55);
      animation: noiseRipple 1.5s linear infinite;
    }
    #noise-ring .nr:nth-child(2) { animation-delay: .5s; }
    #noise-ring .nr:nth-child(3) { animation-delay: 1s; }
    @keyframes noiseRipple {
      from { transform: scale(1); opacity: .7; }
      to { transform: scale(9); opacity: 0; }
    }

    /* 警戒指示：屏幕边缘泛红 */
    #danger-vignette {
      position: fixed; inset: 0; z-index: 12; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(122,20,14,.55) 100%);
      transition: opacity .5s;
    }
    /* 共鸣（歌唱者）指示：屏幕边缘泛紫 + 波纹 */
    #resonance-vignette {
      position: fixed; inset: 0; z-index: 12; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(90,40,110,.6) 100%);
      transition: opacity .4s;
    }
    /* 共鸣计量：喉咙被灌满的竖槽 */
    #resonance-meter {
      position: fixed; right: 4.5%; top: 50%; transform: translateY(-50%);
      z-index: 21; pointer-events: none; text-align: center;
      opacity: 0; transition: opacity .6s;
    }
    #resonance-meter.show { opacity: 1; }
    #resonance-meter .res-label {
      font-size: 11px; letter-spacing: .5em; color: #b58a9a; writing-mode: vertical-rl;
      margin-bottom: 10px; text-shadow: 0 0 8px rgba(150,60,90,.6);
    }
    #resonance-tube {
      width: 7px; height: 170px; margin: 10px auto 0; position: relative;
      border: 1px solid rgba(170,110,140,.4); border-radius: 4px;
      background: rgba(10,6,10,.5); overflow: hidden;
    }
    #resonance-fill {
      position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
      background: linear-gradient(to top, #5c1030, #a03050, #d06080);
      box-shadow: 0 0 12px rgba(180,60,100,.8);
      transition: height .2s linear;
    }
    #resonance-fill::before {
      content: ""; position: absolute; top: -3px; left: 0; right: 0; height: 4px;
      background: rgba(230,160,190,.9); border-radius: 2px;
      animation: resSurface 1.1s ease-in-out infinite;
    }
    @keyframes resSurface { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    #resonance-meter.high { animation: resShake .18s linear infinite; }
    @keyframes resShake {
      0%,100% { transform: translateY(-50%) translateX(0); }
      25% { transform: translateY(-50%) translateX(-1.5px); }
      75% { transform: translateY(-50%) translateX(1.5px); }
    }

    /* 威胁方向指示：一弯淡红的弧，指向盯上你的那双眼睛 */
    #threat-indicator {
      position: fixed; left: 50%; top: 50%; width: 0; height: 0;
      z-index: 13; pointer-events: none; opacity: 0;
      transition: opacity .35s;
    }
    #threat-indicator .th-arc {
      position: absolute; left: -30px; top: -128px; width: 60px; height: 22px;
      border-top: 2px solid rgba(190,70,50,.8);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      filter: drop-shadow(0 0 6px rgba(180,50,35,.7));
    }
    #threat-indicator.alert .th-arc {
      border-top-color: rgba(225,60,38,.95);
      animation: thPulse .5s ease-in-out infinite;
    }
    @keyframes thPulse {
      0%,100% { transform: scaleX(1); opacity: 1; }
      50% { transform: scaleX(1.18); opacity: .65; }
    }

    /* 潜行指示 */
    #stealth-indicator {
      position: fixed; left: 50%; bottom: 5%; transform: translateX(-50%);
      z-index: 20; pointer-events: none; font-size: 12px; letter-spacing: .5em; color: #6f8087;
      opacity: 0; transition: opacity .3s;
    }
    #stealth-indicator.show { opacity: .8; }

    /* 检查点提示 */
    #checkpoint-toast {
      position: fixed; left: 4%; bottom: 6%; z-index: 20; pointer-events: none;
      font-size: 12px; letter-spacing: .35em; color: #6d7f85;
      opacity: 0; transition: opacity .8s;
      text-shadow: 0 1px 2px #000;
    }
    #checkpoint-toast.show { opacity: .85; }
    #checkpoint-toast::before { content: "◈ "; color: #8a9aa0; }

    /* ---------- 视奸 ---------- */
    #sightjack-overlay { position: fixed; inset: 0; z-index: 30; pointer-events: none; display: none; }
    #sightjack-overlay.active { display: block; }
    #sj-static { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .18; mix-blend-mode: screen; }
    #sj-frame {
      position: absolute; inset: 0;
      box-shadow: inset 0 0 160px 70px rgba(0,0,0,.92);
    }
    #sj-frame::before, #sj-frame::after {
      content: ""; position: absolute; left: 0; right: 0; height: 1px;
      background: rgba(180,210,215,.14);
    }
    #sj-frame::before { top: 6%; }
    #sj-frame::after { bottom: 6%; }
    #sj-scanline {
      position: absolute; inset: 0; opacity: .28;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.38) 0px, rgba(0,0,0,.38) 1px, transparent 2px, transparent 4px);
    }
    #sj-label {
      position: absolute; top: 7%; left: 50%; transform: translateX(-50%);
      font-family: "Courier New", monospace; font-size: 15px; letter-spacing: .5em; color: rgba(190,210,215,.85);
      text-shadow: 0 0 8px rgba(150,200,220,.7); white-space: nowrap;
    }
    #sj-signal {
      position: absolute; top: 7%; right: 7%;
      font-family: "Courier New", monospace; font-size: 13px; letter-spacing: .12em;
      color: rgba(170,200,205,.8); text-shadow: 0 0 8px rgba(150,200,220,.6);
    }
    #sj-rec {
      position: absolute; top: 7%; left: 7%;
      font-family: "Courier New", monospace; font-size: 12px; letter-spacing: .3em;
      color: rgba(190,205,210,.65);
    }
    #sj-rec::before {
      content: "●"; color: #c33a2a; margin-right: 8px;
      animation: recBlink 1.6s steps(2) infinite;
    }
    @keyframes recBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: .15; } }
    #sj-hint {
      position: absolute; bottom: 7%; left: 50%; transform: translateX(-50%);
      font-size: 12px; letter-spacing: .3em; color: rgba(160,175,180,.6); font-family: "Courier New", monospace; white-space: nowrap;
    }

    /* ---------- 文书阅读 ---------- */
    #note-overlay {
      position: fixed; inset: 0; z-index: 60; background: rgba(2,3,5,.8);
      display: flex; align-items: center; justify-content: center; pointer-events: auto;
    }
    #note-paper {
      width: min(620px, 86vw); max-height: 78vh; overflow-y: auto;
      background: linear-gradient(160deg, #cdc2a5 0%, #bfb397 55%, #a99c80 100%);
      color: #2a2620; padding: 46px 54px; position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,.85), inset 0 0 60px rgba(90,70,40,.25);
      border: 1px solid #8d8168;
      animation: paperIn .45s cubic-bezier(.2,.7,.3,1);
    }
    @keyframes paperIn {
      from { opacity: 0; transform: translateY(26px) rotate(.8deg); }
      to { opacity: 1; transform: none; }
    }
    #note-paper::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(120,90,50,.14), transparent 42%),
        radial-gradient(ellipse at 85% 90%, rgba(70,60,80,.18), transparent 40%),
        radial-gradient(ellipse at 60% 100%, rgba(60,80,90,.12), transparent 30%);
    }
    #note-title { font-size: 21px; letter-spacing: .3em; margin-bottom: 20px; border-bottom: 1px solid rgba(60,50,30,.4); padding-bottom: 12px; }
    #note-body { font-size: 16px; line-height: 2.15; letter-spacing: .08em; white-space: pre-wrap; }
    #note-close { margin-top: 26px; font-size: 12px; letter-spacing: .3em; color: #6b5f48; text-align: center; }

    /* ---------- 暂停 ---------- */
    #pause-overlay {
      position: fixed; inset: 0; z-index: 70; background: rgba(3,5,8,.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto;
    }
    #pause-overlay h2 { font-size: 34px; letter-spacing: .6em; text-indent: .6em; color: #97a6aa; margin-bottom: 40px; }
    .pause-item { font-size: 16px; letter-spacing: .35em; color: #75858b; margin: 10px 0; cursor: pointer; padding: 6px 30px; transition: color .2s; }
    .pause-item:hover { color: #e0d3ae; }
    #pause-controls { margin-top: 46px; font-size: 13px; color: #56646a; line-height: 2.2; letter-spacing: .15em; text-align: center; }
    #pause-controls kbd { font-family: monospace; color: #a8956a; border: 1px solid #5a4f36; padding: 0 6px; border-radius: 3px; }
    #pause-notes { margin-top: 24px; font-size: 13px; color: #5f6e74; letter-spacing: .2em; }

    /* ---------- 死亡 ---------- */
    #death-overlay {
      position: fixed; inset: 0; z-index: 80; pointer-events: none;
      background: radial-gradient(ellipse at 50% 60%, #240808 0%, #0d0202 80%);
      opacity: 0; transition: opacity 2.5s ease;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
    #death-overlay.show { opacity: 1; }
    #death-text {
      font-size: 96px; letter-spacing: 0; color: #7e2a20;
      text-shadow: 0 0 60px rgba(160,40,25,.7), 0 0 6px rgba(120,20,10,.9);
      filter: blur(0.4px);
    }
    #death-overlay.show #death-text { animation: inkBleed 3.2s ease forwards; }
    @keyframes inkBleed {
      0% { transform: scale(.86); filter: blur(7px); opacity: 0; }
      35% { opacity: 1; }
      100% { transform: scale(1); filter: blur(.4px); opacity: 1; }
    }
    #death-sub { margin-top: 30px; font-size: 14px; letter-spacing: .3em; color: #5c3a34; }
    #death-stats { margin-top: 14px; font-size: 12px; letter-spacing: .25em; color: #4a2e2a; }

    /* ---------- 结局 ---------- */
    #ending-overlay {
      position: fixed; inset: 0; z-index: 90; pointer-events: none;
      background: #030507; opacity: 0; transition: opacity 4s ease;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
    #ending-overlay.show { opacity: 1; }
    #ending-text { font-size: 26px; letter-spacing: .5em; color: #9fb0b3; line-height: 3; text-align: center; }
    #ending-credit { margin-top: 60px; font-size: 13px; letter-spacing: .4em; color: #4a565c; line-height: 2.4; text-align: center; }

    /* 淡入淡出黑幕 */
    #fader { position: fixed; inset: 0; background: #000; z-index: 50; pointer-events: none; opacity: 1; transition: opacity 1.5s ease; }

    /* 屏幕水渍(溺水) */
    #drown-overlay {
      position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(20,40,45,0) 30%, rgba(10,30,38,.75) 100%);
      transition: opacity 1s;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="fader"></div>
  <div id="letterbox"><div class="lb lb-top"></div><div class="lb lb-bottom"></div></div>
  <div id="danger-vignette"></div>
  <div id="resonance-vignette"></div>
  <div id="drown-overlay"></div>
  <div id="crosshair" class="hidden"></div>
  <div id="threat-indicator"><div class="th-arc"></div></div>
  <div id="noise-ring"><div class="nr"></div><div class="nr"></div><div class="nr"></div></div>
  <div id="subtitles"></div>
  <div id="objective-toast"><div class="obj-label">目 标</div><div class="obj-rule"></div><div class="obj-text"></div></div>
  <div id="interact-prompt"><kbd>E</kbd><span></span></div>
  <div id="stealth-indicator">— 潜 行 —</div>
  <div id="checkpoint-toast">这栋楼替你记下了这里</div>

  <div id="resonance-meter">
    <div class="res-label">暴 露</div>
    <div id="resonance-tube"><div id="resonance-fill"></div></div>
  </div>

  <div id="sightjack-overlay">
    <div id="sj-frame"></div>
    <div id="sj-rec">听 潮</div>
    <div id="sj-label"></div>
    <div id="sj-signal"></div>
    <div id="sj-hint">Q / Tab 换一双眼睛 · 移动键 收回来</div>
  </div>

  <div id="note-overlay" class="hidden">
    <div id="note-paper">
      <div id="note-title"></div>
      <div id="note-body"></div>
      <div id="note-close">按 E 或 Esc 收起</div>
    </div>
  </div>

  <div id="pause-overlay" class="hidden">
    <h2>返 潮</h2>
    <div class="pause-item" id="pause-resume">继 续</div>
    <div id="pause-notes"></div>
    <div id="pause-controls">
      <kbd>WASD</kbd> 移动 · <kbd>鼠标</kbd> 视角 · <kbd>Shift</kbd> 潜行 · <kbd>E</kbd> 互动<br/>
      <kbd>Q</kbd>/<kbd>Tab</kbd> 听潮（借入他者的眼睛） · <kbd>Esc</kbd> 暂停
    </div>
  </div>

  <div id="death-overlay">
    <div id="death-text">井</div>
    <div id="death-sub">他把你保存好了 —— 正在回到检查点</div>
    <div id="death-stats"></div>
