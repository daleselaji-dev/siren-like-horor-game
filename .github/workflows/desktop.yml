# 桌面打包：推 main 或 cursor/** 分支 / 手动触发 / 打 v* 标签时构建 Windows 便携 exe 与 Linux AppImage
# 下载方式：仓库 Actions 页 → 本工作流运行记录 → Artifacts；打 tag 时自动附到 Release
name: desktop-build

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: SaltTide-win-portable-exe
          path: release/*.exe
      - name: 附到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: SaltTide-linux-AppImage
          path: release/*.AppImage
      - name: 附到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.AppImage
